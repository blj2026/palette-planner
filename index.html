function comboMood(combo=selections){
  const hsls=ROLES.map(r=>rgbToHsl(combo[r.key].hex));
  const avgS=hsls.reduce((s,x)=>s+x.s,0)/hsls.length;
  const spread=Math.max(...hsls.map(x=>x.l))-Math.min(...hsls.map(x=>x.l));
  const avgL=hsls.reduce((s,x)=>s+x.l,0)/hsls.length;
  if(spread>.58)return 'contrast';
  if(avgS>.55)return 'bright';
  if(avgS<.20)return 'quiet';
  if(avgL<.34)return 'moody';
  return 'mixed';
}
function nameTokens(name){

function seededShuffle(list,seed){
  const arr=[...list];

  }
  return arr;
}
function generateComboName(combo=selections,offset=0){

    const lower=name.toLowerCase();

function renderPalette(){const q=el('search').value.trim().toLowerCase();const p=el('palette');p.innerHTML='';COLORS.filter(c=>(filter==='All'||hueFamily(c)===filter)&&(!q||c.name.toLowerCase().includes(q)||c.number.toLowerCase().includes(q)||c.hex.toLowerCase().includes(q))).forEach(c=>{const used=ROLES.some(r=>selections[r.key].number===c.number);const b=document.createElement('button');b.className='color-btn'+(used?' selected':'');b.innerHTML=`<div class="color-swatch" style="background:${c.hex}"></div><div class="color-num">${c.number}</div><div class="color-name">${c.name}</div>`;b.onclick=()=>{selections[activeRole]=c;currentComboName='custom mix';currentNameSeed=0;renderAll();};p.appendChild(b);});}
function metrics(){const pairs=[['Main vs Contrast',selections.D,selections.L,3],['Main vs Accent',selections.D,selections.M,1.6],['Stripe A vs B',selections.S,selections.T,1.6]];el('metrics').innerHTML=pairs.map(([t,a,b,target])=>{const r=contrastRatio(a.hex,b.hex),w=Math.min(100,Math.round(r/7*100));return `<div class="metric"><div class="metric-top"><span>${t}</span><strong>${r.toFixed(1)}:1</strong></div><div class="bar"><div class="fill" style="width:${w}%"></div></div></div>`;}).join('');}
function isReadable(combo){const nums=ROLES.map(r=>combo[r.key].number);return new Set(nums).size===nums.length&&contrastRatio(combo.D.hex,combo.L.hex)>=3&&contrastRatio(combo.D.hex,combo.M.hex)>=1.6&&contrastRatio(combo.S.hex,combo.T.hex)>=1.6;}
function randomize(){history.push({selections:cloneSelections(),name:currentComboName,seed:currentNameSeed});let combo=cloneSelections();for(let tries=0;tries<1500;tries++){const used=new Set(ROLES.filter(r=>lockedRoles[r.key]).map(r=>combo[r.key].number));ROLES.forEach(r=>{if(!lockedRoles[r.key]){const opts=COLORS.filter(c=>!used.has(c.number));combo[r.key]=opts[Math.floor(Math.random()*opts.length)];used.add(combo[r.key].number);}});if(isReadable(combo))break;}selections=combo;currentNameSeed=0;currentComboName=generateComboName();renderAll();}
function back(){const prev=history.pop();if(!prev)return;selections=cloneSelections(prev.selections);currentComboName=prev.name;currentNameSeed=prev.seed;renderAll();}
function newName(){currentNameSeed++;currentComboName=generateComboName(selections,currentNameSeed);renderAll();}
function openSaveDrawer(kind){pendingSaveKind=kind;el('drawerTitle').textContent=kind==='made'?'Save to made combos':'Save to dig combos';el('drawerSub').textContent='';el('saveDrawer').classList.add('open');el('saveDrawer').setAttribute('aria-hidden','false');setTimeout(()=>el('saveName').focus(),40);updateSaveState();}
function closeSaveDrawer(){el('saveDrawer').classList.remove('open');el('saveDrawer').setAttribute('aria-hidden','true');}
function savePending(){const name=el('saveName').value.trim();if(!name){el('saveName').focus();updateSaveState();return;}saved.unshift({kind:pendingSaveKind,name,note:el('saveNote').value.trim(),comboName:currentComboName,selections:cloneSelections(),at:new Date().toISOString()});saved=saved.slice(0,30);localStorage.setItem(STORAGE,JSON.stringify(saved));el('saveNote').value='';renderSaved();closeSaveDrawer();updateSaveState();}
function escapeHTML(s=''){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function renderSavedList(id,kind){const list=saved.filter(x=>x.kind===kind),box=el(id);box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">No saved combos yet.</div>';return;}list.forEach(item=>{const idx=saved.indexOf(item),meta=ROLES.map(r=>item.selections[r.key].number).join(' / ');const d=document.createElement('div');d.className='saved-card';d.innerHTML=`<button class="delete" aria-label="delete">×</button><div class="saved-colors">${ROLES.map(r=>`<span class="mini" style="background:${item.selections[r.key].hex}"></span>`).join('')}</div><div class="saved-title">${escapeHTML(item.comboName)}</div><div class="saved-meta">${meta} · by ${escapeHTML(item.name)}</div>${item.note?`<div class="saved-note">${escapeHTML(item.note)}</div>`:''}`;d.onclick=e=>{if(e.target.className==='delete')return;selections=cloneSelections(item.selections);currentComboName=item.comboName;renderAll();};d.querySelector('.delete').onclick=()=>{if(confirm('Delete "'+item.comboName+'"?')){saved.splice(idx,1);localStorage.setItem(STORAGE,JSON.stringify(saved));renderSaved();}};box.appendChild(d);});}
function renderSaved(){renderSavedList('digCombos','dig');renderSavedList('madeCombos','made');}
function updateSaveState(){const ok=!!el('saveName').value.trim();el('confirmSave').disabled=!ok;el('saveHint').textContent=ok?'Saving as '+el('saveName').value.trim()+'.':'Tap Dig/Made to add who saved it.';el('saveHint').classList.toggle('ready',ok);el('saveBtn').classList.toggle('active-save',pendingSaveKind==='dig'&&el('saveDrawer').classList.contains('open'));el('madeBtn').classList.toggle('active-save',pendingSaveKind==='made'&&el('saveDrawer').classList.contains('open'));}
function renderAll(){drawChart();renderDots();renderRoles();renderPalette();metrics();el('backBtn').disabled=!history.length;updateSaveState();}
function init(){try{saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');}catch(e){saved=[]}renderFilters();renderSaved();renderAll();}
el('gridToggle').onchange=drawChart;el('randomBtn').onclick=randomize;el('backBtn').onclick=back;el('newNameBtn').onclick=newName;el('saveBtn').onclick=()=>openSaveDrawer('dig');el('madeBtn').onclick=()=>openSaveDrawer('made');el('confirmSave').onclick=savePending;el('cancelSave').onclick=closeSaveDrawer;el('closeSaveDrawer').onclick=closeSaveDrawer;el('saveDrawer').addEventListener('click',e=>{if(e.target.id==='saveDrawer')closeSaveDrawer();});el('search').oninput=renderPalette;el('saveName').oninput=updateSaveState;window.addEventListener('resize',drawChart);init();
</script>
</body>
</html>
