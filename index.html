<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>palette planner</title>
  <style>
    :root {
      --bg:#e8e2d8; --paper:#fbf7ee; --paper2:#f5ede0; --ink:#151515; --muted:#655d54;
      --line:#bdb4a6; --line2:#9f9485; --accent:#b97939; --shadow:0 14px 32px rgba(23,23,23,.12);
      --font-ui:"Segoe UI", Arial, Helvetica, sans-serif; --font-display:"Cascadia Mono","Consolas","Courier New",monospace;
    }
    *{box-sizing:border-box} html{font-size:14px} body{margin:0;color:var(--ink);font-family:var(--font-ui);background:linear-gradient(rgba(17,17,17,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.045) 1px,transparent 1px),radial-gradient(circle at 10% 0%,rgba(17,17,17,.10),transparent 28rem),var(--bg);background-size:28px 28px,28px 28px,auto,auto;}
    button,input,textarea{font:inherit} .page{max-width:760px;margin:0 auto;padding:10px 10px 26px} 
    .hero{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;margin-bottom:9px;border:1px solid var(--line);border-radius:16px;background:rgba(251,247,238,.96);box-shadow:0 8px 20px rgba(23,23,23,.10);backdrop-filter:blur(8px)}
    .brand{display:flex;align-items:center;gap:9px;min-width:0} .logo{width:44px;height:44px;transform:rotate(-3deg);flex:0 0 auto} .logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 0 rgba(255,255,255,.55))} h1{margin:0;font-family:var(--font-display);font-size:22px;line-height:1;letter-spacing:-.075em} .tagline{margin:2px 0 0;color:#9a5d25;font-size:11px;font-style:italic;font-weight:700}
    .card{border:1px solid var(--line);border-radius:16px;background:rgba(251,247,238,.96);box-shadow:var(--shadow);overflow:hidden} .chart-card{padding:8px} .chart-top{display:flex;justify-content:flex-end;align-items:center;margin:0 0 6px;color:#3f3a34;font-size:12px;font-weight:700} .toggle{display:flex;align-items:center;gap:6px} .toggle input{accent-color:#111}
    .chart-scroll{overflow:auto;background:#f8f2e7;border:1px solid var(--line);border-radius:12px;padding:6px;-webkit-overflow-scrolling:touch} #chart{display:grid;width:max-content;transform:scale(.77);transform-origin:top left;margin-bottom:-60px} .cell{width:12px;height:12px;border-left:1px solid transparent;border-top:1px solid transparent}
    .combo-strip{margin-top:8px;padding:10px 11px;border-radius:13px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 18px rgba(0,0,0,.18)} .combo-left{min-width:0;display:flex;align-items:center;gap:8px} #comboName{font-family:var(--font-display);font-size:14px;font-weight:750;letter-spacing:-.055em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dots{display:flex;gap:4px;flex:0 0 auto} .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25)} .icon-btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;width:34px;height:30px;font-weight:900;cursor:pointer}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px} .btn{border:1px solid var(--line2);background:#fbf7ee;border-radius:12px;padding:10px 8px;font-weight:800;font-size:12px;cursor:pointer;min-height:40px} .btn.primary{background:#111;color:#fff;border-color:#111} .btn.save-action{background:#fbf7ee;color:#151515;border-color:var(--line2)} .btn.save-action:not(:disabled){background:#111;color:#fff;border-color:#111} .btn:disabled{opacity:.74;cursor:not-allowed}
    .save-drawer{margin-top:7px;border:1px solid var(--line);border-radius:12px;background:#f8f2e7} .save-drawer summary{cursor:pointer;list-style:none;padding:9px 10px;font-size:12px;text-align:center;color:#4f4941;font-weight:650} .save-drawer summary::-webkit-details-marker{display:none} .save-body{display:grid;grid-template-columns:1fr;gap:7px;padding:0 9px 9px} .save-body input,.save-body textarea{width:100%;border:1px solid var(--line2);border-radius:10px;background:#fffaf2;padding:8px 9px;font-size:12px} .save-body textarea{min-height:48px;resize:vertical}
    details.section{margin-top:9px;border:1px solid var(--line);border-radius:14px;background:rgba(251,247,238,.96);box-shadow:0 8px 18px rgba(23,23,23,.08);overflow:hidden} details.section>summary{list-style:none;cursor:pointer;padding:13px 12px;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center} details.section>summary::-webkit-details-marker{display:none} details.section>summary:after{content:'⌄';font-size:18px;line-height:1} details[open].section>summary:after{content:'⌃'} .section-body{padding:0 10px 11px}
    .roles-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px} .role-card{position:relative;border:1px solid var(--line);background:#f8f2e7;border-radius:12px;padding:7px 5px;text-align:center;min-height:92px;cursor:pointer} .role-card.active{outline:2px solid #111;outline-offset:-2px;background:#fffaf2} .role-card.locked{box-shadow:inset 0 0 0 1px #111} .role-dot{width:32px;height:32px;border-radius:50%;margin:0 auto 5px;border:1px solid rgba(17,17,17,.25)} .role-label{font-size:9px;font-weight:800} .role-num{font-size:10px;margin-top:4px;font-weight:700} .role-name{font-size:8px;color:var(--muted);line-height:1.05;max-height:18px;overflow:hidden} .lock{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);border:0;background:transparent;font-size:13px;cursor:pointer}
    .palette-tools{display:flex;gap:6px;margin-bottom:8px} .search{flex:1;min-width:0;border:1px solid var(--line2);border-radius:999px;background:#fffaf2;padding:9px 12px;font-size:12px} .active-pill{border:1px solid var(--line2);border-radius:999px;background:#111;color:#fff;padding:9px 10px;font-size:11px;font-weight:800;white-space:nowrap} .filters{display:flex;gap:5px;overflow:auto;margin-bottom:8px;padding-bottom:1px} .filter{border:1px solid var(--line);background:#f8f2e7;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;white-space:nowrap;cursor:pointer} .filter.active{background:#111;color:#fff;border-color:#111} .palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;max-height:330px;overflow:auto;padding-right:2px} .color-btn{border:1px solid var(--line);background:#fffaf2;border-radius:12px;padding:5px;min-height:72px;cursor:pointer;position:relative} .color-btn.selected{outline:2px solid #111;outline-offset:-2px} .color-swatch{height:32px;border-radius:9px;margin-bottom:4px;border:1px solid rgba(17,17,17,.16)} .color-num{font-family:var(--font-display);font-size:10px;font-weight:800;letter-spacing:-.04em} .color-name{font-size:7px;color:#5f574f;line-height:1.05;height:16px;overflow:hidden}
    .saved-grid{display:grid;gap:8px} .saved-card{border:1px solid var(--line);border-radius:13px;background:#f8f2e7;padding:9px;display:grid;gap:6px;position:relative} .saved-colors{display:flex;gap:4px} .mini{width:18px;height:18px;border-radius:50%;border:1px solid rgba(17,17,17,.22)} .saved-title{font-weight:900;font-size:12px} .saved-meta,.saved-note{font-size:10px;color:var(--muted)} .delete{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:18px;cursor:pointer} .empty{border:1px dashed var(--line2);border-radius:12px;padding:10px;color:var(--muted);font-size:12px}
    .metrics{display:grid;gap:7px} .metric{border:1px solid var(--line);border-radius:12px;background:#f8f2e7;padding:9px} .metric-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800} .bar{height:5px;background:#d7cbbb;border-radius:99px;overflow:hidden;margin-top:6px} .fill{height:100%;background:#111;border-radius:99px}
    @media (min-width:721px){.page{max-width:1180px;padding:16px} .hero{position:relative} h1{font-size:38px} .tagline{font-size:15px} .logo{width:70px;height:58px} .app-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:12px;align-items:start} #chart{transform:none;margin-bottom:0} .chart-scroll{max-height:530px} .below{display:grid;grid-template-columns:1fr;gap:0} .palette{grid-template-columns:repeat(6,minmax(0,1fr));max-height:420px} details.section:first-child{margin-top:0} }
  </style>
</head>

Raspberry Coulis"},{"hex":"#280C1A","number":"9572","name":"Cabernet"},{"hex":"#997385","number":"1039","name":"Helleborus Heather"},{"hex":"#2E1929","number":"9642","name":"Crushed Grapes"},{"hex":"#482034","number":"1103","name":"Razzleberry Marl"},{"hex":"#613853","number":"9692","name":"Razzleberry Heather"},{"hex":"#B57D9A","number":"8114","name":"Dusty Rose"},{"hex":"#806971","number":"1007","name":"Lepidolite Heather"},{"hex":"#200B1A","number":"8418","name":"Eggplant"},{"hex":"#84757C","number":"8872","name":"Iridescense"},{"hex":"#AD8698","number":"1076","name":"Antique Lilac"},{"hex":"#963239","number":"1008","name":"Flamingo Heather"},{"hex":"#DE7D88","number":"1057","name":"Peony"},{"hex":"#EEDFE9","number":"4192","name":"Soft Pink"},{"hex":"#D0819B","number":"9477","name":"Tutu"},{"hex":"#CA5A84","number":"9478","name":"Cotton Candy"},{"hex":"#B32F64","number":"9469","name":"Hot Pink"},{"hex":"#942A69","number":"7802","name":"Cerise"},{"hex":"#6C6D6B","number":"1009","name":"Storm Cloud Heather"},{"hex":"#4D617B","number":"1101","name":"Faded Denim Marl"},{"hex":"#7C8091","number":"9559","name":"Indigo Frost Heather"},{"hex":"#E5E5DB","number":"8505","name":"White"},{"hex":"#AEAEB1","number":"1058","name":"Nimbus Cloud"},{"hex":"#868588","number":"1050","name":"Harbor Mist"},{"hex":"#6D6F71","number":"8509","name":"Grey"},{"hex":"#2D3443","number":"9473","name":"Gris"},{"hex":"#101114","number":"8555","name":"Black"},{"hex":"#1E1F21","number":"4002","name":"Jet"},{"hex":"#363939","number":"8400","name":"Charcoal Grey"},{"hex":"#5E5D59","number":"1094","name":"Charcoal Marl"},{"hex":"#5B5C53","number":"8401","name":"Silver Grey"},{"hex":"#ABA597","number":"8011","name":"Aspen Heather"},{"hex":"#52545D","number":"9491","name":"Greystone Heather"},{"hex":"#3C2128","number":"1077","name":"Oxblood Red"},{"hex":"#110E0F","number":"7822","name":"Van Dyke Brown"},{"hex":"#322217","number":"2431","name":"Chocolate Heather"},{"hex":"#846651","number":"9695","name":"Praline"},{"hex":"#794A33","number":"1010","name":"Carob Brown"},{"hex":"#1B110C","number":"8686","name":"Brown"},{"hex":"#623F1F","number":"8622","name":"Camel"},{"hex":"#DFC9AB","number":"8021","name":"Beige"},{"hex":"#EEE9D3","number":"8010","name":"Natural"},{"hex":"#B5A564","number":"8412","name":"Pear"},{"hex":"#653A16","number":"2415","name":"Sunflower"},{"hex":"#A66129","number":"1096","name":"Spice Marl"},{"hex":"#613B2F","number":"2453","name":"Pumpkin Spice"},{"hex":"#806627","number":"4010","name":"Straw"},{"hex":"#A08527","number":"9564","name":"Birch Heather"},{"hex":"#826A02","number":"9566","name":"Olive Oil"},{"hex":"#B98E4A","number":"1088","name":"Wheat Heather"},{"hex":"#71705B","number":"4011","name":"Sparrow"},{"hex":"#1E2316","number":"9448","name":"Olive Heather"},{"hex":"#302E2D","number":"9465","name":"Vashon Island Heather"},{"hex":"#513F31","number":"9748","name":"Mocha Heather"},{"hex":"#806E5B","number":"8013","name":"Walnut Heather"},{"hex":"#6F5D4D","number":"1092","name":"Walnut Marl"},{"hex":"#7E7771","number":"8012","name":"Doeskin Heather"},{"hex":"#9A8F7D","number":"2442","name":"Fog Hatt"},{"hex":"#8E7E6F","number":"2441","name":"River Rock"},{"hex":"#E2D6B7","number":"9600","name":"Antiqued Heather"},{"hex":"#B19772","number":"1099","name":"Antique Marl"},{"hex":"#716252","number":"2440","name":"Vinci"},{"hex":"#B18F74","number":"9499","name":"Sand"},{"hex":"#564C3F","number":"9696","name":"Copper Heather"},{"hex":"#5A6862","number":"9450","name":"Smoke Heather"},{"hex":"#798878","number":"1059","name":"Seagrass"},{"hex":"#07070B","number":"9674","name":"Pine Grove"}];
const PATTERN = ["LDDDLDLDDLLLLLLLDDLDLDDDLD","LDDLDLDDLLLDDDLLLDDLDLDDLD","LDLDLDDLLLLDDDLLLLDDLDLDLD","LLDLDDLLLLLDDDLLLLLDDLDLLD","MDMDDMMMDDDMMMDDDMMMDDMDMD","MMDDMMMMDDDMMMDDDMMMMDDMMD","MDDMMMMMDDDMMMDDDMMMMMDDMD","STTSSTTTSSSTTTSSSTTTSSTTST","STTSSTTTSSSTTTSSSTTTSSTTST","STTSSTTTSSSTTTSSSTTTSSTTST","MDDMMMMMDDDMMMDDDMMMMMDDMD","MMDDMMMMDDDMMMDDDMMMMDDMMD","MDMDDMMMDDDMMMDDDMMMDDMDMD","LLDLDDLLLLLDDDLLLLLDDLDLLD","LDLDLDDLLLLDDDLLLLDDLDLDLD","LDDLDLDDLLLDDDLLLDDLDLDDLD","LDDDLDLDDLLLLLLLDDLDLDDDLD"];
const ROLES=[{key:'D',label:'Main',defaultNumber:'9689'},{key:'L',label:'Contrast',defaultNumber:'8011'},{key:'M',label:'Accent',defaultNumber:'9687'},{key:'S',label:'Stripe A',defaultNumber:'8505'},{key:'T',label:'Stripe B',defaultNumber:'2422'}];
const ROLE_LABELS=Object.fromEntries(ROLES.map(r=>[r.key,r.label]));
const DEFAULT_SELECTIONS=Object.fromEntries(ROLES.map(r=>[r.key,COLORS.find(c=>c.number===r.defaultNumber)||COLORS[0]]));
let selections={...DEFAULT_SELECTIONS}, activeRole='D', lockedRoles=Object.fromEntries(ROLES.map(r=>[r.key,false])), history=[], saved=[];
let currentComboName='starter mix', currentNameSeed=0, filter='All';
const STORAGE='palettePlannerSavedCombosAppFirstV1'; const el=id=>document.getElementById(id);
function hexToRgb(hex){const c=hex.replace('#','');return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16));}
function luminance(hex){const [r,g,b]=hexToRgb(hex).map(v=>{const s=v/255;return s<=.03928?s/12.92:Math.pow((s+.055)/1.055,2.4);});return .2126*r+.7152*g+.0722*b;}
function contrastRatio(a,b){const l1=luminance(a),l2=luminance(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
function rgbToHsl(hex){const [r,g,b]=hexToRgb(hex).map(v=>v/255),max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/2;if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;h/=6}return {h:h*360,s,l};}
function hueFamily(c){const {h,s,l}=rgbToHsl(c.hex);if(s<.14||l<.12||l>.92)return 'Neutral'; if(h<18||h>=345)return 'Warm'; if(h<70)return 'Warm'; if(h<160)return 'Green'; if(h<205)return 'Cool'; if(h<255)return 'Cool'; if(h<320)return 'Purple'; return 'Warm';}
function cloneSelections(src=selections){return Object.fromEntries(ROLES.map(r=>[r.key,src[r.key]]));}
function comboHash(combo=selections){return ROLES.reduce((s,r,i)=>s+[...String(combo[r.key].number)].reduce((a,ch)=>a+ch.charCodeAt(0),0)*(i+7),0);}
const BANK={Warm:['ember','copper','spice','golden','rose','cherry'],Cool:['storm','cobalt','denim','harbor','sapphire','low tide'],Green:['moss','fern','lichen','pine','greenhouse','kelp'],Purple:['plum','velvet','orchid','cosmic','violet','regal'],Neutral:['smoke','stone','dune','charcoal','fog','static']};
const EXTRAS=['secret menu','analog','noir','signal','static','side quest','low tide','mood ring','weather','afterhours'];
function generateComboName(combo=selections,offset=0){const families=ROLES.map(r=>hueFamily(combo[r.key]));const primary=families.sort((a,b)=>families.filter(x=>x===b).length-families.filter(x=>x===a).length)[0]||'Neutral';const seed=comboHash(combo)+offset*47;const left=(BANK[primary]||BANK.Neutral)[Math.abs(seed)%((BANK[primary]||BANK.Neutral).length)];const right=EXTRAS[Math.abs(seed+13)%EXTRAS.length];return left===right?left+' remix':left+' '+right;}
currentComboName=generateComboName();
function getPattern(){const base=PATTERN.map(r=>r.repeat(3));let width=base[0].length;const sc=document.querySelector('.chart-scroll');if(sc){const inner=sc.clientWidth-14;width=Math.max(width,Math.floor(inner/12));}const body=base.map((row,i)=>row+PATTERN[i].repeat(Math.ceil((width-row.length)/PATTERN[i].length)).slice(0,Math.max(0,width-row.length)));const pad='D'.repeat(body[0].length);return [...Array(4).fill(pad),...body,...Array(4).fill(pad)];}
function drawChart(){const chart=el('chart'),pat=getPattern(),show=el('gridToggle').checked;chart.innerHTML='';chart.style.gridTemplateColumns=`repeat(${pat[0].length},12px)`;chart.style.borderRight=show?'1px solid #56524d':'1px solid transparent';chart.style.borderBottom=show?'1px solid #56524d':'1px solid transparent';pat.forEach(row=>row.split('').forEach(k=>{const d=document.createElement('div');d.className='cell';d.style.background=(selections[k]||selections.D).hex;d.style.borderLeft=show?'1px solid #56524d':'1px solid transparent';d.style.borderTop=show?'1px solid #56524d':'1px solid transparent';chart.appendChild(d);}));}
function renderDots(){el('comboDots').innerHTML=ROLES.map(r=>`<span class="dot" style="background:${selections[r.key].hex}"></span>`).join(''); el('comboName').textContent=currentComboName;}
function renderRoles(){el('activeRoleLabel').textContent=ROLE_LABELS[activeRole];el('roleCards').innerHTML='';ROLES.forEach(r=>{const c=selections[r.key];const card=document.createElement('button');card.className='role-card'+(activeRole===r.key?' active':'')+(lockedRoles[r.key]?' locked':'');card.innerHTML=`<div class="role-dot" style="background:${c.hex}"></div><div class="role-label">${r.label}</div><div class="role-num">${c.number}</div><div class="role-name">${c.name}</div><button class="lock" type="button">${lockedRoles[r.key]?'🔒':'🔓'}</button>`;card.addEventListener('click',()=>{activeRole=r.key;renderAll();});card.querySelector('.lock').addEventListener('click',e=>{e.stopPropagation();lockedRoles[r.key]=!lockedRoles[r.key];renderAll();});el('roleCards').appendChild(card);});}
function renderFilters(){const items=['All','Warm','Cool','Green','Purple','Neutral'];el('filters').innerHTML=items.map(x=>`<button class="filter ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderPalette();renderFilters();});}
function renderPalette(){const q=el('search').value.trim().toLowerCase();const p=el('palette');p.innerHTML='';COLORS.filter(c=>(filter==='All'||hueFamily(c)===filter)&&(!q||c.name.toLowerCase().includes(q)||c.number.toLowerCase().includes(q)||c.hex.toLowerCase().includes(q))).forEach(c=>{const used=ROLES.some(r=>selections[r.key].number===c.number);const b=document.createElement('button');b.className='color-btn'+(used?' selected':'');b.innerHTML=`<div class="color-swatch" style="background:${c.hex}"></div><div class="color-num">${c.number}</div><div class="color-name">${c.name}</div>`;b.onclick=()=>{selections[activeRole]=c;currentComboName='custom mix';currentNameSeed=0;renderAll();};p.appendChild(b);});}
function metrics(){const pairs=[['Main vs Contrast',selections.D,selections.L,3],['Main vs Accent',selections.D,selections.M,1.6],['Stripe A vs B',selections.S,selections.T,1.6]];el('metrics').innerHTML=pairs.map(([t,a,b,target])=>{const r=contrastRatio(a.hex,b.hex),w=Math.min(100,Math.round(r/7*100));return `<div class="metric"><div class="metric-top"><span>${t}</span><strong>${r.toFixed(1)}:1</strong></div><div class="bar"><div class="fill" style="width:${w}%"></div></div></div>`;}).join('');}
function isReadable(combo){const nums=ROLES.map(r=>combo[r.key].number);return new Set(nums).size===nums.length&&contrastRatio(combo.D.hex,combo.L.hex)>=3&&contrastRatio(combo.D.hex,combo.M.hex)>=1.6&&contrastRatio(combo.S.hex,combo.T.hex)>=1.6;}
function randomize(){history.push({selections:cloneSelections(),name:currentComboName,seed:currentNameSeed});let combo=cloneSelections();for(let tries=0;tries<1500;tries++){const used=new Set(ROLES.filter(r=>lockedRoles[r.key]).map(r=>combo[r.key].number));ROLES.forEach(r=>{if(!lockedRoles[r.key]){const opts=COLORS.filter(c=>!used.has(c.number));combo[r.key]=opts[Math.floor(Math.random()*opts.length)];used.add(combo[r.key].number);}});if(isReadable(combo))break;}selections=combo;currentNameSeed=0;currentComboName=generateComboName();renderAll();}
function back(){const prev=history.pop();if(!prev)return;selections=cloneSelections(prev.selections);currentComboName=prev.name;currentNameSeed=prev.seed;renderAll();}
function newName(){currentNameSeed++;currentComboName=generateComboName(selections,currentNameSeed);renderAll();}
function save(kind){const name=el('saveName').value.trim();if(!name){el('saveDrawer').open=true;el('saveName').focus();return;}saved.unshift({kind,name,note:el('saveNote').value.trim(),comboName:currentComboName,selections:cloneSelections(),at:new Date().toISOString()});saved=saved.slice(0,30);localStorage.setItem(STORAGE,JSON.stringify(saved));el('saveNote').value='';renderSaved();updateSaveState();}
function escapeHTML(s=''){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function renderSavedList(id,kind){const list=saved.filter(x=>x.kind===kind),box=el(id);box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">No saved combos yet.</div>';return;}list.forEach(item=>{const idx=saved.indexOf(item),meta=ROLES.map(r=>item.selections[r.key].number).join(' / ');const d=document.createElement('div');d.className='saved-card';d.innerHTML=`<button class="delete" aria-label="delete">×</button><div class="saved-colors">${ROLES.map(r=>`<span class="mini" style="background:${item.selections[r.key].hex}"></span>`).join('')}</div><div class="saved-title">${escapeHTML(item.comboName)}</div><div class="saved-meta">${meta} · by ${escapeHTML(item.name)}</div>${item.note?`<div class="saved-note">${escapeHTML(item.note)}</div>`:''}`;d.onclick=e=>{if(e.target.className==='delete')return;selections=cloneSelections(item.selections);currentComboName=item.comboName;renderAll();};d.querySelector('.delete').onclick=()=>{if(confirm('Delete "'+item.comboName+'"?')){saved.splice(idx,1);localStorage.setItem(STORAGE,JSON.stringify(saved));renderSaved();}};box.appendChild(d);});}
function renderSaved(){renderSavedList('digCombos','dig');renderSavedList('madeCombos','made');}
function updateSaveState(){const ok=!!el('saveName').value.trim();el('saveBtn').disabled=!ok;el('madeBtn').disabled=!ok;el('saveSummary').textContent=ok?'Saving as '+el('saveName').value.trim():'Add a name and note to save';}
function renderAll(){drawChart();renderDots();renderRoles();renderPalette();metrics();el('backBtn').disabled=!history.length;updateSaveState();}
function init(){try{saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');}catch(e){saved=[]}renderFilters();renderSaved();renderAll();}
el('gridToggle').onchange=drawChart;el('randomBtn').onclick=randomize;el('backBtn').onclick=back;el('newNameBtn').onclick=newName;el('saveBtn').onclick=()=>save('dig');el('madeBtn').onclick=()=>save('made');el('search').oninput=renderPalette;el('saveName').oninput=updateSaveState;window.addEventListener('resize',drawChart);init();
</script>
